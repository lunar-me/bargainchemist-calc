<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#25408F" />
  <meta name="description" content="Bargain Chemist Price Promise calculator — match a competitor's price and get an extra 10% off the difference." />
  <title>Price Match Calculator — Bargain Chemist</title>
  <link rel="icon" type="image/svg+xml" href="logo_2x.svg" />
  <style>
    :root {
      --bc-blue: #25408f;
      --bc-blue-dark: #1b2f6b;
      --bc-red: #eb2a25;
      --bc-red-dark: #c31f1b;
      --ink: #1c2233;
      --muted: #6b7280;
      --line: #d7dce8;
      --bg: #eef1f7;
      --screen: #f7f9fc;
      --white: #ffffff;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      justify-content: center;
      align-items: stretch;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    .app {
      width: 100%;
      max-width: 460px;
      min-height: 100dvh;
      background: var(--white);
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(37, 64, 143, 0.12);
    }

    /* ---------- Header ---------- */
    header {
      background: var(--bc-blue);
      color: var(--white);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 0 0 auto;
    }

    header .logo {
      height: 34px;
      width: auto;
      display: block;
    }

    header .title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      opacity: 0.95;
      line-height: 1.15;
    }

    /* Title is a link, but deliberately styled to look like plain text. */
    header a.title,
    header a.title:visited,
    header a.title:hover,
    header a.title:active,
    header a.title:focus {
      color: inherit;
      text-decoration: none;
      font: inherit;
      letter-spacing: inherit;
      outline: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    header .title small {
      display: block;
      font-weight: 400;
      font-size: 11px;
      opacity: 0.85;
    }

    /* ---------- Screen / display ---------- */
    .screen {
      background: var(--screen);
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }

    .field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 2px solid var(--line);
      border-radius: var(--radius);
      background: var(--white);
      cursor: pointer;
      transition: border-color 0.12s ease, box-shadow 0.12s ease;
    }

    .field + .field { margin-top: 8px; }

    .field.active {
      border-color: var(--bc-blue);
      box-shadow: 0 0 0 3px rgba(37, 64, 143, 0.14);
    }

    .field .label {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
    }

    .field .label span { display: block; font-weight: 400; font-size: 11px; }

    .field .value {
      font-size: 26px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
      color: var(--ink);
      text-align: right;
      white-space: nowrap;
    }

    .field.active .value { color: var(--bc-blue); }

    /* ---------- Formula + result ---------- */
    .formula {
      margin-top: 12px;
      font-size: 12px;
      line-height: 1.4;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      word-break: break-word;
      min-height: 17px;
    }

    .result {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--line);
    }

    .result .result-label {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--bc-blue);
    }

    .result .result-value {
      font-size: 34px;
      font-weight: 800;
      color: var(--bc-red);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
      white-space: nowrap;
      transition: color 0.12s ease;
    }

    .result.no-match .result-label { color: var(--muted); }
    .result.no-match .result-value { color: var(--ink); font-size: 18px; font-weight: 600; }

    .note {
      margin-top: 6px;
      font-size: 12px;
      color: var(--bc-red);
      font-weight: 600;
      min-height: 15px;
    }

    /* ---------- Keypad ---------- */
    .keypad {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 14px 16px 20px;
      background: var(--white);
      align-content: end;
    }

    .key {
      border: none;
      border-radius: var(--radius);
      background: #eef1f7;
      color: var(--ink);
      font-size: 26px;
      font-weight: 700;
      font-family: inherit;
      padding: 0;
      min-height: 60px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.05s ease, background 0.12s ease, color 0.12s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .key:active { transform: scale(0.96); background: #dde3ef; }

    .key.fn {
      background: var(--bc-blue);
      color: var(--white);
      font-size: 20px;
    }

    .key.fn:active { background: var(--bc-blue-dark); }

    .key.clear {
      background: var(--bc-red);
      color: var(--white);
      font-size: 20px;
    }

    .key.clear:active { background: var(--bc-red-dark); }

    .backspace-icon { font-size: 24px; line-height: 1; }

    footer {
      flex: 0 0 auto;
      text-align: center;
      font-size: 10px;
      color: var(--muted);
      padding: 0 16px 12px;
      line-height: 1.5;
    }

    footer a {
      color: var(--bc-blue);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid rgba(37, 64, 143, 0.4);
    }

    footer a:active { color: var(--bc-blue-dark); }

    @media (max-height: 720px) {
      .key { min-height: 52px; font-size: 23px; }
      .field .value { font-size: 23px; }
      .result .result-value { font-size: 30px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <img class="logo" src="logo_2x.svg" alt="Bargain Chemist" />
      <a class="title" href="https://www.bargainchemist.co.nz/pages/pricebeatguarantee" target="_blank" rel="noopener noreferrer">Price Promise Calculator<small>Match the price + extra 10% off the difference</small></a>
    </header>

    <section class="screen" aria-live="polite">
      <div class="field active" id="field-bc" data-target="bc">
        <div class="label">Bargain Chemist price<span>our price</span></div>
        <div class="value" id="value-bc">$0.00</div>
      </div>

      <div class="field" id="field-comp" data-target="comp">
        <div class="label">Competitor price<span>their price</span></div>
        <div class="value" id="value-comp">$0.00</div>
      </div>

      <div class="formula" id="formula"></div>

      <div class="result" id="result">
        <span class="result-label" id="result-label">Customer pays</span>
        <span class="result-value" id="result-value">$0.00</span>
      </div>

      <div class="note" id="note"></div>
    </section>

    <section class="keypad" id="keypad">
      <button class="key" data-key="7" type="button">7</button>
      <button class="key" data-key="8" type="button">8</button>
      <button class="key" data-key="9" type="button">9</button>
      <button class="key" data-key="4" type="button">4</button>
      <button class="key" data-key="5" type="button">5</button>
      <button class="key" data-key="6" type="button">6</button>
      <button class="key" data-key="1" type="button">1</button>
      <button class="key" data-key="2" type="button">2</button>
      <button class="key" data-key="3" type="button">3</button>
      <button class="key fn" data-key="." type="button">.</button>
      <button class="key" data-key="0" type="button">0</button>
      <button class="key fn" data-key="backspace" type="button" aria-label="Backspace"><span class="backspace-icon">&#9003;</span></button>
      <button class="key clear" data-key="clear" type="button" style="grid-column: span 3;">AC&nbsp;&nbsp;Clear all</button>
    </section>

    <footer>
      Prices in NZD. Extra 10% off the difference applies when the competitor is cheaper.<br />
      <a href="https://github.com/lunar-me/bargainchemist-calc" target="_blank" rel="noopener noreferrer">View source on GitHub</a>
    </footer>
  </main>

  <script>
    (function () {
      "use strict";

      // ----- State -------------------------------------------------------
      // Raw digit strings, e.g. "12" or "12.5" or "12.50". Empty = nothing entered.
      var state = { bc: "", comp: "" };
      var active = "bc"; // which field the keypad edits

      var MAX_INT_DIGITS = 6; // up to 999,999
      var MAX_DECIMALS = 2;

      // ----- Elements ----------------------------------------------------
      var fields = {
        bc: {
          wrap: document.getElementById("field-bc"),
          value: document.getElementById("value-bc")
        },
        comp: {
          wrap: document.getElementById("field-comp"),
          value: document.getElementById("value-comp")
        }
      };
      var formulaEl = document.getElementById("formula");
      var resultEl = document.getElementById("result");
      var resultLabelEl = document.getElementById("result-label");
      var resultValueEl = document.getElementById("result-value");
      var noteEl = document.getElementById("note");

      // ----- Helpers -----------------------------------------------------
      function money(n) {
        return "$" + n.toFixed(2);
      }

      function moneyFromRaw(raw) {
        return money(toNumber(raw));
      }

      // Convert a raw digit string to a number (empty -> 0).
      function toNumber(raw) {
        if (raw === "" || raw === ".") return 0;
        var n = parseFloat(raw);
        return isNaN(n) ? 0 : n;
      }

      // Round half-up to 2 decimals, avoiding binary float surprises.
      function round2(n) {
        return Math.round((n + Number.EPSILON) * 100) / 100;
      }

      // ----- Input editing ----------------------------------------------
      function press(key) {
        var raw = state[active];

        if (key === "clear") {
          state = { bc: "", comp: "" };
          render();
          return;
        }

        if (key === "backspace") {
          raw = raw.slice(0, -1);
        } else if (key === ".") {
          if (raw.indexOf(".") !== -1) return; // only one decimal point
          raw = raw === "" ? "0." : raw + ".";
        } else {
          // digit
          var parts = raw.split(".");
          var decimals = parts.length > 1 ? parts[1] : null;

          if (decimals !== null) {
            if (decimals.length >= MAX_DECIMALS) return; // cap 2 decimals
            raw = raw + key;
          } else {
            var intPart = parts[0];
            if (intPart === "0") {
              raw = key; // replace a lone leading zero with the new digit
            } else {
              if (intPart.length >= MAX_INT_DIGITS) return; // cap integer digits
              raw = raw + key;
            }
          }
        }

        state[active] = raw;
        render();
      }

      // ----- Rendering ---------------------------------------------------
      function render() {
        // Field values
        fields.bc.value.textContent = moneyFromRaw(state.bc);
        fields.comp.value.textContent = moneyFromRaw(state.comp);

        // Active field highlight
        fields.bc.wrap.classList.toggle("active", active === "bc");
        fields.comp.wrap.classList.toggle("active", active === "comp");

        var bc = toNumber(state.bc);
        var comp = toNumber(state.comp);
        var hasInput = state.bc !== "" || state.comp !== "";

        if (!hasInput) {
          formulaEl.textContent = "Enter both prices to calculate.";
          resultEl.classList.remove("no-match");
          resultLabelEl.textContent = "Customer pays";
          resultValueEl.textContent = money(0);
          noteEl.textContent = "";
          return;
        }

        if (comp >= bc) {
          // No price match applies (competitor not lower)
          resultEl.classList.add("no-match");
          resultLabelEl.textContent = "No price match";
          resultValueEl.textContent = "Competitor not lower";
          formulaEl.textContent =
            money(comp) + " \u2212 10% \u00D7 (" + money(bc) + " \u2212 " + money(comp) + ")";
          noteEl.textContent =
            comp > bc
              ? "Competitor price is higher than ours \u2014 no price match."
              : "Prices are equal \u2014 no price match needed.";
          return;
        }

        // Match applies: Competitor price - 10% * (BC price - competitor price)
        var diff = bc - comp;
        var discount = round2(0.1 * diff);
        var result = round2(comp - 0.1 * diff);

        // Guard: a negative result is not a valid customer price — show nothing.
        if (result < 0) {
          resultEl.classList.remove("no-match");
          resultLabelEl.textContent = "Customer pays";
          resultValueEl.textContent = "";
          formulaEl.textContent = "";
          noteEl.textContent = "";
          return;
        }

        resultEl.classList.remove("no-match");
        resultLabelEl.textContent = "Customer pays";
        resultValueEl.textContent = money(result);
        formulaEl.textContent =
          money(comp) + " \u2212 10% \u00D7 (" + money(bc) + " \u2212 " + money(comp) +
          ") = " + money(result);
        noteEl.textContent =
          "Price matched \u2014 extra " + money(discount) + " off (10% of " + money(round2(diff)) + ").";
      }

      // ----- Events ------------------------------------------------------
      document.getElementById("keypad").addEventListener("click", function (e) {
        var btn = e.target.closest("[data-key]");
        if (!btn) return;
        press(btn.getAttribute("data-key"));
      });

      fields.bc.wrap.addEventListener("click", function () { active = "bc"; render(); });
      fields.comp.wrap.addEventListener("click", function () { active = "comp"; render(); });

      // Physical keyboard support (desktop convenience)
      window.addEventListener("keydown", function (e) {
        var handled = true;
        if (e.key >= "0" && e.key <= "9") { press(e.key); }
        else if (e.key === "." || e.key === ",") { press("."); }
        else if (e.key === "Backspace") { press("backspace"); }
        else if (e.key === "Escape") { press("clear"); }
        else if (e.key === "Tab" || e.key === "ArrowDown" || e.key === "ArrowUp") {
          active = active === "bc" ? "comp" : "bc";
          render();
        } else { handled = false; }
        if (handled) e.preventDefault();
      });

      // Prevent double-tap zoom on iOS
      document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });

      // ----- Init --------------------------------------------------------
      render();
    })();
  </script>
</body>
</html>
